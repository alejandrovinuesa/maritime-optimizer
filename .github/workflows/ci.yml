name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      MARITIME_OPT_HOME: ${{ github.workspace }}/.maritime-opt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Natural Earth cartography
        uses: actions/cache@v4
        with:
          path: .maritime-opt/geodata
          key: natural-earth-50m-land-v1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app examples

      - name: Download cartography
        run: maritime-opt geodata

      - name: Test
        run: pytest -q

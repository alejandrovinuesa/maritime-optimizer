# Rebuilds the five example dashboards from the current code and publishes them on
# GitHub Pages. One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Dashboards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MARITIME_OPT_HOME: ${{ github.workspace }}/.maritime-opt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[viz]"
      - run: maritime-opt dashboard all --out site
      # Pre-generated report (written once by the maintainer; the workflow makes no model calls).
      - run: cp -r examples/reports site/reports
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
